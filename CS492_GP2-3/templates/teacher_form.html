{% extends 'base.html' %}{% block title %}Register Teacher{% endblock %}{% block content %}<section class="form-card"><h1>Register Teacher</h1><p>A secure teacher account is created with the teacher record.</p><form method="post" class="grid-form"><label>Employee ID *<input name="employee_id" value="{{ request.form.get('employee_id','') }}" required></label><label>First Name *<input name="first_name" value="{{ request.form.get('first_name','') }}" required></label><label>Last Name *<input name="last_name" value="{{ request.form.get('last_name','') }}" required></label><label>Email *<input type="email" name="email" value="{{ request.form.get('email','') }}" required></label><label>Department *<input name="department" value="{{ request.form.get('department','') }}" required></label><label>Username *<input name="username" value="{{ request.form.get('username','') }}" required></label><label>Password *<input type="password" name="password" minlength="8" required></label><div class="full"><button type="submit">Save Teacher</button> <a href="{{ url_for('teachers') }}">Cancel</a></div></form></section>{% endblock %}
